name: Mutation testing

# Slow, so it runs weekly and on demand rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  stryker:
    name: Stryker (logic layer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Restore incremental results
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental-logic.json
          key: stryker-logic-${{ github.sha }}
          restore-keys: stryker-logic-
      - run: npm run mutate
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
